# ==========================================================
# GitHub Actions - Continuous Integration (CI) Workflow
# ==========================================================
#
# Purpose
# ----------------------------------------------------------
# Verifies that the complete end-to-end Machine Learning pipeline 
# executes cleanly, tracks experiments on DagsHub/MLflow, and 
# passes all automated unit/model tests on a fresh runner.
#
# Trigger
# ----------------------------------------------------------
# • Every push to the main branch
# • Every Pull Request targeting the main branch
#
# ==========================================================

name: CI Pipeline

# ----------------------------------------------------------
# Workflow Triggers
# ----------------------------------------------------------
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# ----------------------------------------------------------
# Jobs Configuration
# ----------------------------------------------------------
jobs:

  project-testing:

    # Runner Machine
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Step 1 : Checkout Repository
      # -----------------------------------------------------
      # Downloads the latest source code from GitHub into the runner.
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # Step 2 : Setup Python Environment
      # -----------------------------------------------------
      # Installs Python 3.12 and restores cached pip dependencies 
      # to drastically speed up workflow execution times.
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # =====================================================
      # Step 3 : Upgrade pip Tooling
      # =====================================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # =====================================================
      # Step 4 : Install Project Dependencies
      # -----------------------------------------------------
      # Installs all required Python libraries (DVC, MLflow, 
      # Scikit-learn, Dagshub, pytest, etc.) from requirements.txt.
      # =====================================================
      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt

      # =====================================================
      # Step 5 : Verify DVC Installation
      # =====================================================
      - name: Verify DVC Installation
        run: |
          dvc --version

      # =====================================================
      # Step 6 : Configure DVC Authentication
      # -----------------------------------------------------
      # Authenticates DVC against the DagsHub remote HTTP storage 
      # using the stored GitHub secret DAG_GIT_TOKEN.
      # =====================================================
      - name: Configure DVC Remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user AREEB-08
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      # =====================================================
      # Step 7 : Pull Data & Model Tracked Files via DVC
      # -----------------------------------------------------
      # Downloads raw datasets, interim files, and artifacts from 
      # DagsHub storage into the local runner directory.
      # =====================================================
      - name: Pull Data from DVC Remote
        run: |
          dvc pull

      # =====================================================
      # Step 8 : Execute Complete DVC Pipeline
      # -----------------------------------------------------
      # Runs end-to-end pipeline stages defined in dvc.yaml:
      # Data Ingestion -> Preprocessing -> Feature Engineering 
      # -> Model Building -> Model Evaluation.
      # Logs parameters, metrics, and registered models to MLflow.
      # =====================================================
      - name: Execute DVC Pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc repro

      # =====================================================
      # Step 9 : Run Model & Pipeline Test Suite
      # -----------------------------------------------------
      # Runs automated unit and integration tests using pytest.
      # Tests model loading from MLflow registry, input dimensions,
      # end-to-end prediction sanity, and performance baselines.
      # =====================================================
      - name: Run Model and Pipeline Tests
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          pytest tests/ -v

      # =====================================================
      # Step 10 : CI Completion Status
      # =====================================================
      - name: Pipeline Execution Summary
        run: |
          echo "CI Pipeline and Model Verification completed successfully!"