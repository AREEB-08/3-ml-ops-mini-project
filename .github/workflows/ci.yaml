# ==========================================================
# GitHub Actions - Continuous Integration (CI)
# ==========================================================
#
# Purpose
# ----------------------------------------------------------
# This workflow verifies that the complete Machine Learning
# pipeline can run successfully on a fresh machine.
#
# Trigger
# ----------------------------------------------------------
# • Every push to the main branch
# • Every Pull Request to the main branch
#
# Workflow
# ----------------------------------------------------------
# 1. Checkout source code
# 2. Setup Python
# 3. Restore pip cache
# 4. Install project dependencies
# 5. Configure DVC authentication
# 6. Pull data from DVC remote
# 7. Execute complete DVC pipeline
#
# ==========================================================

name: CI Pipeline

# ----------------------------------------------------------
# Workflow Triggers
# ----------------------------------------------------------
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# ----------------------------------------------------------
# Jobs
# ----------------------------------------------------------
jobs:

  project-testing:

    # Runner Machine
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Step 1 : Checkout Repository
      # -----------------------------------------------------
      # Downloads the latest source code from GitHub.
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # Step 2 : Setup Python
      # -----------------------------------------------------
      # Installs Python and restores the pip cache.
      #
      # cache: pip
      # ---------
      # GitHub automatically caches downloaded Python
      # packages. Future workflow runs become much faster
      # because packages are restored from cache instead
      # of downloading them again.
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # =====================================================
      # Step 3 : Upgrade pip
      # =====================================================
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # =====================================================
      # Step 4 : Install Project Dependencies
      # -----------------------------------------------------
      # Installs all required Python packages listed in
      # requirements.txt.
      # =====================================================
      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt

      # =====================================================
      # Step 5 : Verify DVC Installation
      # -----------------------------------------------------
      # Prints the installed DVC version.
      # Useful for debugging.
      # =====================================================
      - name: Verify DVC
        run: |
          dvc --version

      # =====================================================
      # Step 6 : Configure DVC Authentication
      # -----------------------------------------------------
      # Configures authentication for the DagsHub DVC remote
      # using GitHub Secrets.
      #
      # Secret Used:
      # DAG_GIT_TOKEN
      # =====================================================
      - name: Configure DVC
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user AREEB-08
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      # =====================================================
      # Step 7 : Pull Data from DVC Remote
      # -----------------------------------------------------
      # Downloads all datasets, trained models and other
      # DVC-tracked files required by the pipeline.
      # =====================================================
      - name: Pull DVC Data
        run: |
          dvc pull

      # =====================================================
      # Step 8 : Execute Complete DVC Pipeline
      # -----------------------------------------------------
      # Executes:
      #
      # Data Ingestion
      #        ↓
      # Data Preprocessing
      #        ↓
      # Feature Engineering
      #        ↓
      # Model Building
      #        ↓
      # Model Evaluation
      #
      # If any stage fails, GitHub Actions will stop
      # immediately and mark the workflow as Failed.
      # =====================================================
      - name: Execute DVC Pipeline
        run: |
          dvc repro

      # =====================================================
      # Step 9 : Pipeline Completed
      # =====================================================
      - name: Success
        run: |
          echo "CI Pipeline executed successfully."