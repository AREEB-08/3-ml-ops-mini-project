# ==========================================================
# GitHub Actions - Continuous Integration (CI) Workflow
# ==========================================================
#
# Purpose
# ----------------------------------------------------------
# Verifies that the complete end-to-end Machine Learning pipeline 
# executes cleanly, tracks experiments on DagsHub/MLflow, and 
# passes all automated unit/integration tests on a fresh runner.
#
# Trigger
# ----------------------------------------------------------
# • Every push to the main branch
# • Every Pull Request targeting the main branch
#
# Secrets Required
# ----------------------------------------------------------
# • DAG_GIT_TOKEN: DagsHub Personal Access Token (PAT)
#
# ==========================================================

name: CI Pipeline

# ----------------------------------------------------------
# Workflow Triggers
# ----------------------------------------------------------
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# ----------------------------------------------------------
# Jobs Configuration
# ----------------------------------------------------------
jobs:

  project-testing:

    # Runner Machine Environment
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Step 1 : Checkout Repository
      # -----------------------------------------------------
      # Clones the latest source code from GitHub into the runner.
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # Step 2 : Setup Python Environment
      # -----------------------------------------------------
      # Installs Python 3.12 and restores cached pip dependencies 
      # to accelerate workflow execution speed.
      # =====================================================
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # =====================================================
      # Step 3 : Upgrade pip Tooling
      # -----------------------------------------------------
      # Ensures the package installer is updated to the latest version.
      # =====================================================
      - name: Upgrade Pip Tooling
        run: |
          python -m pip install --upgrade pip

      # =====================================================
      # Step 4 : Install Project Dependencies
      # -----------------------------------------------------
      # Installs all required Python packages (DVC, MLflow, 
      # Scikit-learn, Flask, Dagshub, pytest, etc.) from requirements.txt.
      # =====================================================
      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt

      # =====================================================
      # Step 5 : Verify DVC Installation
      # -----------------------------------------------------
      # Validates DVC binary installation on the runner.
      # =====================================================
      - name: Verify DVC Installation
        run: |
          dvc --version

      # =====================================================
      # Step 6 : Configure DVC Remote Authentication
      # -----------------------------------------------------
      # Authenticates DVC against the DagsHub remote HTTP storage 
      # using the stored GitHub secret DAG_GIT_TOKEN.
      # =====================================================
      - name: Configure DVC Remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user AREEB-08
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      # =====================================================
      # Step 7 : Pull Data & Model Tracked Files via DVC
      # -----------------------------------------------------
      # Downloads datasets and tracked artifacts from DagsHub 
      # remote storage into the runner's workspace.
      # =====================================================
      - name: Pull Data from DVC Remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc pull

      # =====================================================
      # Step 8 : Execute Complete DVC Pipeline
      # -----------------------------------------------------
      # Runs end-to-end pipeline stages defined in dvc.yaml:
      # Data Ingestion -> Preprocessing -> Feature Engineering 
      # -> Model Building -> Model Evaluation.
      # Logs parameters, metrics, and registered models to MLflow.
      # =====================================================
      - name: Execute DVC Pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
          MLFLOW_TRACKING_USERNAME: AREEB-08
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc repro

      # =====================================================
      # Step 9 : Run Automated Unit and Integration Tests
      # -----------------------------------------------------
      # Discovers and runs all test modules inside tests/ 
      # (test_model.py, test_flask_app.py) using pytest.
      # Evaluates model performance, dimension shapes, and Flask endpoints.
      # =====================================================
      - name: Run Model and Flask App Tests
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
          MLFLOW_TRACKING_USERNAME: AREEB-08
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          python -m pytest tests/ -v

      # =====================================================
      # Step 10 : CI Completion Status Summary
      # =====================================================
      - name: Pipeline Execution Summary
        run: |
          echo "CI Pipeline execution and integration tests completed successfully!"