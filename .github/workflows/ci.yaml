# ==========================================================
# GitHub Actions - Continuous Integration & Deployment Pipeline
# ==========================================================
#
# Purpose
# ----------------------------------------------------------
# Verifies that the complete end-to-end Machine Learning pipeline 
# executes cleanly, tracks experiments on DagsHub/MLflow, passes 
# automated unit/integration tests, and builds/pushes versioned 
# Docker images to Docker Hub.
#
# Triggers
# ----------------------------------------------------------
# • Every push to the main branch
# • Every Pull Request targeting the main branch
#
# Required Repository Secrets
# ----------------------------------------------------------
# • DAG_GIT_TOKEN: DagsHub Personal Access Token (PAT)
# • DOCKER_HUB_USERNAME: Docker Hub Account Username
# • DOCKER_HUB_ACCESS_TOKEN: Docker Hub Personal Access Token
#
# ==========================================================

name: CI/CD Pipeline

# ----------------------------------------------------------
# Workflow Triggers
# ----------------------------------------------------------
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# ----------------------------------------------------------
# Jobs Configuration
# ----------------------------------------------------------
jobs:

  project-testing:

    # Runner Machine Environment
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Step 1 : Checkout Repository
      # -----------------------------------------------------
      # Clones the source code into the runner. fetch-depth: 0 
      # fetches the full Git history required for accurate commit counting.
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # Step 2 : Setup Python Environment
      # -----------------------------------------------------
      # Installs Python 3.12 and restores cached pip dependencies 
      # to accelerate workflow execution speed.
      # =====================================================
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # =====================================================
      # Step 3 : Upgrade pip Tooling
      # -----------------------------------------------------
      # Ensures the package installer is updated to the latest version.
      # =====================================================
      - name: Upgrade Pip Tooling
        run: |
          python -m pip install --upgrade pip

      # =====================================================
      # Step 4 : Install Project Dependencies
      # -----------------------------------------------------
      # Installs all required Python packages (DVC, MLflow, 
      # Scikit-learn, Flask, Dagshub, pytest, etc.) from requirements.txt.
      # =====================================================
      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt

      # =====================================================
      # Step 5 : Verify DVC Installation
      # -----------------------------------------------------
      # Validates DVC binary installation on the runner.
      # =====================================================
      - name: Verify DVC Installation
        run: |
          dvc --version

      # =====================================================
      # Step 6 : Configure DVC Remote Authentication
      # -----------------------------------------------------
      # Authenticates DVC against the DagsHub remote HTTP storage 
      # using the stored GitHub secret DAG_GIT_TOKEN.
      # =====================================================
      - name: Configure DVC Remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user AREEB-08
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"

      # =====================================================
      # Step 7 : Pull Data & Model Tracked Files via DVC
      # -----------------------------------------------------
      # Downloads datasets and tracked artifacts from DagsHub 
      # remote storage into the runner's workspace.
      # =====================================================
      - name: Pull Data from DVC Remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc pull

      # =====================================================
      # Step 8 : Execute Complete DVC Pipeline
      # -----------------------------------------------------
      # Runs end-to-end pipeline stages defined in dvc.yaml:
      # Data Ingestion -> Preprocessing -> Feature Engineering 
      # -> Model Building -> Model Evaluation.
      # Logs parameters, metrics, and registered models to MLflow.
      # =====================================================
      - name: Execute DVC Pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
          MLFLOW_TRACKING_USERNAME: AREEB-08
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          dvc repro

      # =====================================================
      # Step 9 : Prepare Deployment Artifacts
      # -----------------------------------------------------
      # Copies the latest trained model and vectorizer
      # generated by the DVC pipeline into the deployment
      # directory for container packaging.
      # =====================================================
      - name: Prepare Deployment Artifacts
        run: |
          # Create deployment/models directory if missing
          mkdir -p deployment/models

          # Verify that the trained artifacts exist
          test -f models/model.pkl
          test -f models/vectorizer.pkl

          # Copy artifacts to deployment directory
          cp models/model.pkl deployment/models/model.pkl
          cp models/vectorizer.pkl deployment/models/vectorizer.pkl

          echo "Latest model artifacts copied successfully."
          ls -lh deployment/models/

      # =====================================================
      # Step 10 : Run Automated Unit and Integration Tests
      # -----------------------------------------------------
      # Discovers and executes all tests inside the tests/ directory.
      # Validates model loading, prediction pipeline, and Flask endpoints.
      # =====================================================
      - name: Run Model and Flask App Tests
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAG_GIT_TOKEN }}
          MLFLOW_TRACKING_USERNAME: AREEB-08
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAG_GIT_TOKEN }}
        run: |
          python -m pytest tests/ -v

      # =====================================================
      # Step 11 : Calculate Git Commit Version Tag
      # -----------------------------------------------------
      # Counts total commits on the branch to create a persistent 
      # version tag (e.g., v1, v2, v15). This strategy is immune 
      # to workflow file replacements or reset runner counters.
      # =====================================================
      - name: Get Total Commit Count for Versioning
        id: vars
        run: |
          echo "commit_count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      # =====================================================
      # Step 12 : CI Pipeline Success Summary
      # -----------------------------------------------------
      # Prints a execution summary prior to container distribution.
      # =====================================================
      - name: Pipeline Execution Summary
        run: |
          echo "=========================================="
          echo " CI Pipeline executed successfully."
          echo " DVC Pipeline completed."
          echo " Model artifacts prepared."
          echo " All tests passed."
          echo " Container Version Tag: v${{ steps.vars.outputs.commit_count }}"
          echo "=========================================="

      # =====================================================
      # Step 13 : Authenticate with Docker Hub
      # -----------------------------------------------------
      # Log in to Docker Hub using secrets provided in GitHub settings.
      # =====================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # =====================================================
      # Step 14 : Build and Push Versioned Docker Image
      # -----------------------------------------------------
      # Builds image using deployment/ context and tags it with 
      # both 'latest' and the persistent version tag 'v<commit_count>'.
      # Only pushes to Docker Hub on main branch commits.
      # =====================================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./deployment
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/basic_ed:v${{ steps.vars.outputs.commit_count }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/basic_ed:latest